<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Collections · NavPlace</title>
    <script>
        // Apply theme before paint to avoid flash
        (function () {
            try {
                const saved = localStorage.getItem('navplace.theme');
                const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.dataset.theme = theme;
            }
            catch {
                document.documentElement.dataset.theme = 'light';
            }
        })();
    </script>
    <style>
        :root,
        [data-theme="light"] {
            --bg: #fafaf9;
            --panel: #ffffff;
            --border: #e7e5e4;
            --border-strong: #d6d3d1;
            --text: #1c1917;
            --text-soft: #57534e;
            --text-mute: #a8a29e;
            --accent: #18181b;
            --on-accent: #ffffff;
            --accent-soft: #f4f4f5;
            --danger: #b91c1c;
            --danger-soft: #fef2f2;
            --ok: #166534;
            --ok-soft: #f0fdf4;
            --warn: #b45309;
            --warn-dot: #f59e0b;
            --focus: 0 0 0 3px rgba(24, 24, 27, 0.12);
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 28px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.15);
            --backdrop: rgba(15, 15, 15, 0.4);
        }

        [data-theme="dark"] {
            --bg: #0c0c0e;
            --panel: #161618;
            --border: #27272a;
            --border-strong: #3f3f46;
            --text: #f4f4f5;
            --text-soft: #a1a1aa;
            --text-mute: #71717a;
            --accent: #f4f4f5;
            --on-accent: #0c0c0e;
            --accent-soft: #1f1f23;
            --danger: #f87171;
            --danger-soft: #2a1414;
            --ok: #4ade80;
            --ok-soft: #102818;
            --warn: #fbbf24;
            --warn-dot: #fbbf24;
            --focus: 0 0 0 3px rgba(244, 244, 245, 0.18);
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5);
            --shadow-md: 0 8px 28px rgba(0, 0, 0, 0.45);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.6);
            --backdrop: rgba(0, 0, 0, 0.6);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            color: var(--text);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
            transition: background 160ms ease, color 160ms ease;
        }

        .app {
            display: grid;
            grid-template-rows: auto 1fr;
            height: 100vh;
        }

        /* ---------- Top bar ---------- */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
        }
        .brand {
            display: flex;
            align-items: baseline;
            gap: 12px;
        }
        .brand a {
            color: var(--text-mute);
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 0.02em;
        }
        .brand a:hover {
            color: var(--text);
        }
        .brand h1 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .topbar-meta {
            font-size: 12px;
            color: var(--text-mute);
        }

        /* ---------- Main layout ---------- */
        .main {
            display: grid;
            grid-template-columns: 300px 1fr;
            overflow: hidden;
        }

        /* ---------- Sidebar ---------- */
        .sidebar {
            border-right: 1px solid var(--border);
            background: var(--panel);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sidebar-head {
            padding: 16px 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .sidebar-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .sidebar-title {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-mute);
        }
        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            padding: 0;
            border: 1px solid var(--border);
            background: var(--panel);
            border-radius: var(--radius-sm);
            color: var(--text-soft);
            cursor: pointer;
            transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
        }
        .icon-btn:hover {
            background: var(--accent-soft);
            color: var(--text);
            border-color: var(--border-strong);
        }
        .icon-btn:focus-visible {
            outline: none;
            box-shadow: var(--focus);
        }
        .icon-btn svg {
            width: 16px;
            height: 16px;
        }

        .search {
            position: relative;
        }
        .search input {
            width: 100%;
            padding: 7px 10px 7px 30px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg);
            font: inherit;
            color: var(--text);
            transition: border-color 120ms ease, box-shadow 120ms ease, background 120ms ease;
        }
        .search input:focus {
            outline: none;
            border-color: var(--border-strong);
            background: var(--panel);
            box-shadow: var(--focus);
        }
        .search svg {
            position: absolute;
            top: 50%;
            left: 9px;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            color: var(--text-mute);
            pointer-events: none;
        }

        .list {
            list-style: none;
            margin: 0;
            padding: 4px 8px 12px;
            overflow-y: auto;
            flex: 1;
        }
        .list-item {
            padding: 9px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 2px;
            color: var(--text-soft);
            transition: background 100ms ease, color 100ms ease;
            min-width: 0;
        }
        .list-item:hover {
            background: var(--accent-soft);
            color: var(--text);
        }
        .list-item.active {
            background: var(--accent);
            color: var(--on-accent);
        }
        .list-item.active .list-item-time {
            color: color-mix(in srgb, var(--on-accent) 55%, transparent);
        }
        .list-item-title {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .list-item-time {
            font-size: 11px;
            color: var(--text-mute);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .load-more {
            margin: 8px 4px 0;
            padding: 8px;
            text-align: center;
            border-radius: var(--radius-sm);
            font-size: 12px;
            color: var(--text-mute);
            cursor: pointer;
            border: 1px dashed var(--border);
            background: transparent;
            width: calc(100% - 8px);
        }
        .load-more:hover {
            color: var(--text);
            border-color: var(--border-strong);
            background: var(--accent-soft);
        }
        .list-placeholder {
            padding: 24px 12px;
            text-align: center;
            color: var(--text-mute);
            font-size: 13px;
        }
        .list-placeholder.error {
            color: var(--danger);
        }

        /* ---------- Editor ---------- */
        .content {
            overflow: auto;
            display: flex;
            justify-content: center;
        }
        .editor {
            width: 100%;
            max-width: 820px;
            padding: 32px 40px 80px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--text-mute);
            padding: 80px 40px;
            gap: 12px;
        }
        .empty svg {
            width: 48px;
            height: 48px;
            color: var(--border-strong);
        }
        .empty h2 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
        }
        .empty p {
            margin: 0;
            font-size: 13px;
            max-width: 320px;
        }

        /* ---------- Save status ---------- */
        .save-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-mute);
            min-height: 22px;
        }
        .save-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-mute);
        }
        .save-status.saved .dot {
            background: var(--ok);
        }
        .save-status.saved {
            color: var(--ok);
        }
        .save-status.pending .dot {
            background: var(--warn-dot);
            animation: pulse 1.2s ease-in-out infinite;
        }
        .save-status.pending {
            color: var(--warn);
        }
        .save-status.saving .dot {
            background: var(--warn-dot);
            animation: pulse 0.7s ease-in-out infinite;
        }
        .save-status.saving {
            color: var(--warn);
        }
        .save-status.error .dot {
            background: var(--danger);
        }
        .save-status.error {
            color: var(--danger);
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.35; }
        }

        .label-input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text);
            padding: 4px 0;
        }
        .label-input::placeholder {
            color: var(--text-mute);
        }
        .label-input:focus {
            outline: none;
        }

        .body-input {
            width: 100%;
            min-height: 460px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 18px;
            background: var(--panel);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 13px;
            line-height: 1.65;
            color: var(--text);
            resize: vertical;
            transition: border-color 120ms ease, box-shadow 120ms ease;
        }
        .body-input:focus {
            outline: none;
            border-color: var(--border-strong);
            box-shadow: var(--focus);
        }

        .footer-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border-radius: var(--radius-sm);
            font: inherit;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
            transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
        }
        .btn:hover {
            background: var(--accent-soft);
            border-color: var(--border-strong);
        }
        .btn:focus-visible {
            outline: none;
            box-shadow: var(--focus);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn.primary {
            background: var(--accent);
            color: var(--on-accent);
            border-color: var(--accent);
        }
        .btn.ghost-danger {
            color: var(--danger);
            border-color: transparent;
            background: transparent;
        }
        .btn.ghost-danger:hover {
            background: var(--danger-soft);
            border-color: transparent;
        }

        /* ---------- Toast ---------- */
        .toast-stack {
            position: fixed;
            right: 20px;
            bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 50;
            pointer-events: none;
        }
        .toast {
            pointer-events: auto;
            min-width: 220px;
            max-width: 360px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            background: var(--panel);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-md);
            color: var(--text);
            font-size: 13px;
            animation: toast-in 160ms ease-out;
        }
        .toast.ok {
            border-color: color-mix(in srgb, var(--ok) 40%, var(--border));
            background: var(--ok-soft);
            color: var(--ok);
        }
        .toast.error {
            border-color: color-mix(in srgb, var(--danger) 40%, var(--border));
            background: var(--danger-soft);
            color: var(--danger);
        }
        @keyframes toast-in {
            from { transform: translateY(8px); opacity: 0; }
            to   { transform: translateY(0);   opacity: 1; }
        }

        /* ---------- Modal ---------- */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: var(--backdrop);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            animation: fade-in 120ms ease-out;
        }
        @keyframes fade-in {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        .modal {
            width: min(420px, calc(100vw - 32px));
            background: var(--panel);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
            padding: 22px 24px 20px;
        }
        .modal h3 {
            margin: 0 0 6px;
            font-size: 16px;
            font-weight: 600;
        }
        .modal p {
            margin: 0 0 18px;
            color: var(--text-soft);
            font-size: 13px;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        .modal .btn.danger {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger);
        }

        /* Theme toggle: only show the icon for the *other* theme */
        [data-theme="light"] .icon-moon { display: inline; }
        [data-theme="light"] .icon-sun  { display: none; }
        [data-theme="dark"]  .icon-moon { display: none; }
        [data-theme="dark"]  .icon-sun  { display: inline; }

        @media (max-width: 760px) {
            .main {
                grid-template-columns: 1fr;
            }
            .sidebar {
                border-right: none;
                border-bottom: 1px solid var(--border);
                max-height: 40vh;
            }
            .editor {
                padding: 24px 20px 60px;
            }
        }
    </style>
</head>
<body>

<div class="app">
    <header class="topbar">
        <div class="brand">
            <a href="/">NavPlace</a>
            <h1>Collections</h1>
        </div>
        <div class="topbar-right">
            <div class="topbar-meta" id="topbar_meta"></div>
            <button class="icon-btn" id="theme_btn" title="Toggle theme" aria-label="Toggle theme">
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/></svg>
            </button>
        </div>
    </header>

    <div class="main">
        <aside class="sidebar">
            <div class="sidebar-head">
                <div class="sidebar-title-row">
                    <div class="sidebar-title">Your collections</div>
                    <button class="icon-btn" id="new_btn" title="New collection (N)" aria-label="New collection">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>
                </div>
                <div class="search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="search" id="search_input" placeholder="Filter">
                </div>
            </div>
            <ul class="list" id="list">
                <li class="list-placeholder">Loading...</li>
            </ul>
        </aside>

        <main class="content">
            <div class="editor" id="editor"></div>
        </main>
    </div>
</div>

<div class="toast-stack" id="toasts"></div>
<div id="modal_root"></div>

<script>
const api = '/api/v1/collections';
const SAVE_DEBOUNCE_MS = 700;
const PAGE_SIZE = 50;

const state = {
    collections: [],
    total: 0,
    current: null,
    saved: null,           // last server-confirmed snapshot of current
    save_status: 'idle',   // idle | pending | saving | error
    save_timer: null,
    save_in_flight: null,
    filter: '',
};

const els = {
    list: document.getElementById('list'),
    editor: document.getElementById('editor'),
    search: document.getElementById('search_input'),
    new_btn: document.getElementById('new_btn'),
    theme_btn: document.getElementById('theme_btn'),
    meta: document.getElementById('topbar_meta'),
    toasts: document.getElementById('toasts'),
    modal_root: document.getElementById('modal_root'),
};

// ---------- HTTP ----------
async function http(method, url, body)
{
    const opts = {method, headers: {}};
    if (body !== undefined) {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(body);
    }
    const res = await fetch(url, opts);
    if (!res.ok) {
        const text = await res.text();
        throw new Error(text || `${res.status} ${res.statusText}`);
    }
    if (res.status === 204) {
        return null;
    }
    return await res.json();
}

// ---------- Toast ----------
function toast(message, kind)
{
    const el = document.createElement('div');
    el.className = `toast ${kind || ''}`;
    el.textContent = message;
    els.toasts.appendChild(el);
    setTimeout(() => {
        el.style.transition = 'opacity 200ms ease, transform 200ms ease';
        el.style.opacity = '0';
        el.style.transform = 'translateY(4px)';
        setTimeout(() => el.remove(), 220);
    }, 2400);
}

// ---------- Modal confirm ----------
function confirm_modal({title, message, confirm_label = 'Confirm', danger = false})
{
    return new Promise(resolve => {
        const backdrop = document.createElement('div');
        backdrop.className = 'modal-backdrop';
        backdrop.innerHTML = `
            <div class="modal" role="dialog" aria-modal="true">
                <h3></h3>
                <p></p>
                <div class="modal-actions">
                    <button class="btn" data-action="cancel">Cancel</button>
                    <button class="btn ${danger ? 'danger' : 'primary'}" data-action="ok"></button>
                </div>
            </div>
        `;
        backdrop.querySelector('h3').textContent = title;
        backdrop.querySelector('p').textContent = message;
        const ok_btn = backdrop.querySelector('[data-action="ok"]');
        ok_btn.textContent = confirm_label;

        function close(result) {
            document.removeEventListener('keydown', on_key);
            backdrop.remove();
            resolve(result);
        }
        function on_key(event) {
            if (event.key === 'Escape') close(false);
            if (event.key === 'Enter')  close(true);
        }

        backdrop.addEventListener('click', event => {
            if (event.target === backdrop) close(false);
        });
        backdrop.querySelector('[data-action="cancel"]').onclick = () => close(false);
        ok_btn.onclick = () => close(true);
        document.addEventListener('keydown', on_key);

        els.modal_root.appendChild(backdrop);
        ok_btn.focus();
    });
}

// ---------- Theme ----------
function set_theme(theme)
{
    document.documentElement.dataset.theme = theme;
    try {
        localStorage.setItem('navplace.theme', theme);
    }
    catch {}
}
function toggle_theme()
{
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    set_theme(next);
}

// ---------- Time formatting ----------
function format_relative(value)
{
    if (!value) return '';
    const then = new Date(value).getTime();
    const now = Date.now();
    const sec = Math.max(0, Math.round((now - then) / 1000));
    if (sec < 45)        return 'just now';
    if (sec < 90)        return '1 minute ago';
    if (sec < 3600)      return `${Math.round(sec / 60)} minutes ago`;
    if (sec < 5400)      return '1 hour ago';
    if (sec < 86400)     return `${Math.round(sec / 3600)} hours ago`;
    if (sec < 86400 * 2) return 'yesterday';
    if (sec < 86400 * 7) return `${Math.round(sec / 86400)} days ago`;
    return new Date(value).toLocaleDateString();
}

// ---------- List ----------
async function load_list(offset = 0)
{
    try {
        const url = `${api}?limit=${PAGE_SIZE}&offset=${offset}`;
        const data = await http('GET', url);
        if (offset === 0) {
            state.collections = data.items;
        }
        else {
            state.collections.push(...data.items);
        }
        state.total = data.total;
        render_list();
        render_meta();
    }
    catch (error) {
        els.list.innerHTML = '';
        const li = document.createElement('li');
        li.className = 'list-placeholder error';
        li.textContent = error.message;
        els.list.appendChild(li);
    }
}

function render_list()
{
    els.list.innerHTML = '';

    const filtered = state.filter
        ? state.collections.filter(c => c.label.toLowerCase().includes(state.filter))
        : state.collections;

    if (!filtered.length) {
        const li = document.createElement('li');
        li.className = 'list-placeholder';
        li.textContent = state.collections.length
            ? 'No matches.'
            : 'No collections yet. Press + to create one.';
        els.list.appendChild(li);
        return;
    }

    for (const c of filtered) {
        const li = document.createElement('li');
        li.className = 'list-item';
        if (state.current && state.current.uid === c.uid) {
            li.classList.add('active');
        }
        li.title = c.label || 'Untitled';

        const label_el = document.createElement('div');
        label_el.className = 'list-item-title';
        label_el.textContent = c.label || 'Untitled';
        li.appendChild(label_el);

        const time_el = document.createElement('div');
        time_el.className = 'list-item-time';
        time_el.textContent = format_relative(c.updated_at);
        li.appendChild(time_el);

        li.onclick = () => open_collection(c.uid);
        els.list.appendChild(li);
    }

    if (!state.filter && state.collections.length < state.total) {
        const more = document.createElement('button');
        more.className = 'load-more';
        const remaining = state.total - state.collections.length;
        more.textContent = `Load ${Math.min(remaining, PAGE_SIZE)} more`;
        more.onclick = () => load_list(state.collections.length);
        els.list.appendChild(more);
    }
}

function render_meta()
{
    const n = state.total;
    els.meta.textContent = n === 0 ? '' : `${n} collection${n === 1 ? '' : 's'}`;
}

// ---------- Editor ----------
async function open_collection(uid)
{
    await flush_pending_save();
    try {
        const data = await http('GET', `${api}/${encodeURIComponent(uid)}`);
        state.current = data;
        state.saved = {...data};
        set_save_status('idle');
        render_editor();
        render_list();
    }
    catch (error) {
        toast(error.message, 'error');
    }
}

function render_editor()
{
    els.editor.innerHTML = '';

    if (!state.current) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
            <h2>Nothing selected</h2>
            <p>Pick a collection from the sidebar, or create a new one to get started.</p>
        `;
        els.editor.appendChild(empty);
        return;
    }

    const head = document.createElement('div');
    head.className = 'editor-head';
    const status = document.createElement('span');
    status.className = 'save-status';
    status.id = 'save_status';
    status.innerHTML = '<span class="dot"></span><span class="label"></span>';
    head.appendChild(status);
    els.editor.appendChild(head);

    const label_input = document.createElement('input');
    label_input.className = 'label-input';
    label_input.id = 'label_input';
    label_input.type = 'text';
    label_input.maxLength = 255;
    label_input.placeholder = 'Untitled';
    label_input.value = state.current.label;
    label_input.oninput = () => {
        state.current.label = label_input.value;
        on_edit();
    };
    els.editor.appendChild(label_input);

    const contents_input = document.createElement('textarea');
    contents_input.className = 'body-input';
    contents_input.id = 'contents_input';
    contents_input.spellcheck = false;
    contents_input.value = state.current.contents;
    contents_input.oninput = () => {
        state.current.contents = contents_input.value;
        on_edit();
    };
    els.editor.appendChild(contents_input);

    const footer = document.createElement('div');
    footer.className = 'footer-actions';
    footer.innerHTML = '<span></span>';
    const delete_btn = document.createElement('button');
    delete_btn.className = 'btn ghost-danger';
    delete_btn.textContent = 'Delete collection';
    delete_btn.onclick = () => delete_current();
    footer.appendChild(delete_btn);
    els.editor.appendChild(footer);

    paint_save_status();
}

// ---------- Auto-save ----------
function is_dirty()
{
    if (!state.current || !state.saved) return false;
    return state.current.label    !== state.saved.label
        || state.current.contents !== state.saved.contents;
}

function set_save_status(status)
{
    state.save_status = status;
    paint_save_status();
}

function paint_save_status()
{
    const el = document.getElementById('save_status');
    if (!el) return;
    const label = el.querySelector('.label');
    el.classList.remove('saved', 'pending', 'saving', 'error');
    switch (state.save_status) {
        case 'idle':    el.classList.add('saved');   label.textContent = 'Saved';            break;
        case 'pending': el.classList.add('pending'); label.textContent = 'Unsaved changes'; break;
        case 'saving':  el.classList.add('saving');  label.textContent = 'Saving…';         break;
        case 'error':   el.classList.add('error');   label.textContent = 'Save failed';     break;
    }
}

function on_edit()
{
    if (!is_dirty()) {
        clear_save_timer();
        set_save_status('idle');
        return;
    }
    set_save_status('pending');
    schedule_save();
}

function schedule_save()
{
    clear_save_timer();
    state.save_timer = setTimeout(do_save, SAVE_DEBOUNCE_MS);
}

function clear_save_timer()
{
    if (state.save_timer) {
        clearTimeout(state.save_timer);
        state.save_timer = null;
    }
}

async function do_save()
{
    state.save_timer = null;
    if (state.save_in_flight) return;       // a save is already running; it will reschedule on completion
    if (!state.current || !is_dirty()) {
        set_save_status('idle');
        return;
    }

    const target_uid = state.current.uid;
    const snapshot = {label: state.current.label, contents: state.current.contents};
    const patch = {};
    const trimmed_label = (snapshot.label || '').trim();
    if (trimmed_label && trimmed_label !== state.saved.label) {
        patch.label = trimmed_label;
    }
    if (snapshot.contents !== state.saved.contents) {
        patch.contents = snapshot.contents;
    }
    if (!Object.keys(patch).length) {
        // e.g. only change was clearing the label — nothing valid to send yet
        return;
    }

    set_save_status('saving');
    state.save_in_flight = (async () => {
        try {
            const data = await http('PATCH', `${api}/${encodeURIComponent(target_uid)}`, patch);
            // Only commit if user hasn’t switched away
            if (!state.current || state.current.uid !== target_uid) return;
            state.saved = {...data};
            // Keep user’s in-progress typing in fields the server normalized (label)
            // but reconcile any unedited fields with server response.
            if (state.current.label.trim() === data.label) {
                state.current.label = data.label;
                const li = document.getElementById('label_input');
                if (li && li.value !== data.label) li.value = data.label;
            }

            // Bump in sidebar to top to match server’s updated_at desc order
            const idx = state.collections.findIndex(c => c.uid === target_uid);
            const summary = {
                uid: target_uid,
                label: data.label,
                created_at: data.created_at,
                updated_at: data.updated_at,
            };
            if (idx !== -1) state.collections.splice(idx, 1);
            state.collections.unshift(summary);
            render_list();

            set_save_status(is_dirty() ? 'pending' : 'idle');
            if (is_dirty()) schedule_save();
        }
        catch (error) {
            set_save_status('error');
            toast(error.message, 'error');
        }
        finally {
            state.save_in_flight = null;
        }
    })();
}

async function flush_pending_save()
{
    if (state.save_timer) {
        clear_save_timer();
        await do_save();
    }
    if (state.save_in_flight) {
        await state.save_in_flight;
    }
}

// ---------- Mutations ----------
async function delete_current()
{
    if (!state.current) return;
    const ok = await confirm_modal({
        title: 'Delete collection?',
        message: `“${state.current.label || 'Untitled'}” will be permanently deleted.`,
        confirm_label: 'Delete',
        danger: true,
    });
    if (!ok) return;
    clear_save_timer();
    try {
        await http('DELETE', `${api}/${encodeURIComponent(state.current.uid)}`);
        state.collections = state.collections.filter(c => c.uid !== state.current.uid);
        state.total = Math.max(0, state.total - 1);
        state.current = null;
        state.saved = null;
        set_save_status('idle');
        render_list();
        render_editor();
        render_meta();
        toast('Deleted', 'ok');
    }
    catch (error) {
        toast(error.message, 'error');
    }
}

async function create_collection()
{
    await flush_pending_save();
    try {
        const c = await http('POST', api, {});
        state.collections.unshift({
            uid: c.uid,
            label: c.label,
            created_at: c.created_at,
            updated_at: c.updated_at,
        });
        state.total += 1;
        state.current = c;
        state.saved = {...c};
        set_save_status('idle');
        render_list();
        render_editor();
        render_meta();
        const label_el = document.getElementById('label_input');
        if (label_el) {
            label_el.focus();
            label_el.select();
        }
    }
    catch (error) {
        toast(error.message, 'error');
    }
}

// ---------- Wiring ----------
els.new_btn.onclick = create_collection;
els.theme_btn.onclick = toggle_theme;
els.search.oninput = () => {
    state.filter = els.search.value.trim().toLowerCase();
    render_list();
};

window.addEventListener('keydown', event => {
    const mod = event.metaKey || event.ctrlKey;
    if (mod && event.key.toLowerCase() === 's') {
        // Force-flush an immediate save
        event.preventDefault();
        if (state.save_timer) {
            clear_save_timer();
            do_save();
        }
        return;
    }
    const tag = (event.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (event.key === 'n' && !mod) {
        event.preventDefault();
        create_collection();
    }
    if (event.key === '/' && !mod) {
        event.preventDefault();
        els.search.focus();
    }
});

window.addEventListener('beforeunload', event => {
    if (state.save_timer || state.save_in_flight || is_dirty()) {
        event.preventDefault();
        event.returnValue = '';
    }
});

render_editor();
load_list();
</script>

</body>
</html>
