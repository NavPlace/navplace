services:

  authwall:
    image: vbarbarosh/authwall
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AUTHWALL_SEED: foo:foo;bar:bar
      AUTHWALL_LOGGER: stdout
      AUTHWALL_PUBLIC_URL: http://127.0.0.1:3000
      AUTHWALL_TARGET_URL: http://navplace:3000
      AUTHWALL_OPTIONAL_AUTH_PATHS: /,/index.html
      AUTHWALL_DB: mysql://authwall:authwall@mysql/authwall
    ports:
      - 3000:3000
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4.8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

  navplace:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      NAVPLACE_DB: mysql://navplace:navplace@mysql/navplace
    volumes:
      - ./config:/app/config
      - ./db:/app/db
      - ./src:/app/src
    depends_on:
      - mysql
