# https://editor.swagger.io/
# https://redocly.github.io/redoc

openapi: 3.0.3
info:
  title: NavPlace API
  version: 1.0.0
  description: |
    OpenAPI spec for the implemented NavPlace API v1 routes.

    Authentication is handled by Authwall before API handlers run. API clients
    may use a personal access token provided by Authwall:

    `Authentication: Bearer pat_xxx`

    These routes require a current user and return
    `401 Authentication is required` when no user is available.

security:
  - AuthwallPat: []

servers:
  - url: https://navplace.com

paths:
  /api/v1/collections:
    get:
      summary: List collections
      operationId: collections_list
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size (1–100, default 50)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          description: Number of items to skip (default 0)
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Paginated collections for the current user, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Create collection
      operationId: collections_post
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionCreateRequest'
      responses:
        '201':
          description: Created collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/collections/{collection_uid}:
    parameters:
      - $ref: '#/components/parameters/CollectionUid'

    get:
      summary: Fetch collection
      operationId: collections_fetch
      responses:
        '200':
          description: Collection details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/CollectionNotFound'

    patch:
      summary: Update collection label and/or contents
      operationId: collections_patch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionPatchRequest'
      responses:
        '200':
          description: Updated collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          description: Invalid update request
          content:
            text/plain:
              schema:
                type: string
              examples:
                empty_label:
                  value: Label is required
                invalid_contents:
                  value: Contents must be a string
                empty_patch:
                  value: Nothing to update
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/CollectionNotFound'

    delete:
      summary: Delete collection
      operationId: collections_delete
      responses:
        '204':
          description: Collection deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/CollectionNotFound'

components:
  securitySchemes:
    AuthwallPat:
      type: apiKey
      in: header
      name: Authentication
      description: Personal access token provided by Authwall. Use `Bearer pat_xxx`.

  parameters:
    CollectionUid:
      name: collection_uid
      in: path
      required: true
      schema:
        type: string
        example: col_mrybsue3nr4xbadrrhgmxwmi

  responses:
    Unauthorized:
      description: Authentication is required
      content:
        text/plain:
          schema:
            type: string
          example: Authentication is required

    CollectionNotFound:
      description: Collection not found
      content:
        text/plain:
          schema:
            type: string
          example: Collection not found

  schemas:
    CollectionListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CollectionSummary'
        total:
          type: integer
          example: 42
        limit:
          type: integer
          example: 50
        offset:
          type: integer
          example: 0
      required:
        - items
        - total
        - limit
        - offset

    CollectionSummary:
      type: object
      properties:
        uid:
          type: string
          example: col_mrybsue3nr4xbadrrhgmxwmi
        label:
          type: string
          example: Work links
        created_at:
          type: string
          format: date-time
          example: 2026-05-25T10:30:00.000Z
        updated_at:
          type: string
          format: date-time
          example: 2026-05-25T10:30:00.000Z
      required:
        - uid
        - label
        - created_at
        - updated_at

    Collection:
      type: object
      properties:
        uid:
          type: string
          example: col_mrybsue3nr4xbadrrhgmxwmi
        label:
          type: string
          example: Work links
        contents:
          type: string
          example: "% design: basic\n\nGitHub https://github.com"
        created_at:
          type: string
          format: date-time
          example: 2026-05-25T10:30:00.000Z
        updated_at:
          type: string
          format: date-time
          example: 2026-05-25T10:30:00.000Z
      required:
        - uid
        - label
        - contents
        - created_at
        - updated_at

    CollectionCreateRequest:
      type: object
      properties:
        label:
          type: string
          maxLength: 255
          example: Work links
        contents:
          type: string
          example: "% design: basic\n\nGitHub https://github.com"

    CollectionPatchRequest:
      type: object
      minProperties: 1
      properties:
        label:
          type: string
          maxLength: 255
          example: Renamed links
        contents:
          type: string
          example: "% design: basic\n\nDocs https://example.com/docs"
